[package]
name = "sample"
version = "0.0.1"
edition = "2024"

[workspace]
members = ["sample-core"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"

[lib]
name = "sample"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26.0", features = ["extension-module", "abi3-py310"] }

[dev-dependencies]
assert_cmd = "2"
