name: Run tests

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -V
      - run: cargo test --all-features

  python:
    needs: rust
    name: pytest on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (Linux / macOS)
        if: ${{ ! startsWith(matrix.os, 'windows') }}
        run: |
          python -m venv .venv --upgrade-deps
          source .venv/bin/activate
          pipx run maturin develop -E test
      - name: Install (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          python -m venv .venv --upgrade-deps
          .venv\Scripts\activate
          pipx run maturin develop -E test
      - name: Run tests (Linux / macOS)
        if: ${{ ! startsWith(matrix.os, 'windows') }}
        run: |
          source .venv/bin/activate
          pytest
      - name: Run tests (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          .venv\Scripts\activate
          pytest

  linux-build:
    needs: [rust, python]
    name: Test build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          args: --release --out dist
          manylinux: auto

  macos-build:
    needs: [rust, python]
    name: Test build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64
          args: --release --out dist

  windows-build:
    needs: [rust, python]
    name: Test build (Windows) target=${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.arch }}
          args: --release --out dist
